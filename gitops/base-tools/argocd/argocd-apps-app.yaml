apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps
  namespace: argocd
  annotations:
    # argocd-apps renders app-of-apps-base-tools, which in turn manages this Application.
    # With the Application health check enabled, that loop would keep both parents
    # Degraded forever, so leave this app out of app-of-apps-base-tools' health.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: infra
  sources:
  - repoURL: oci://ghcr.io/argoproj/argo-helm/argocd-apps
    targetRevision: 2.0.5
    path: .
    helm:
      valueFiles:
      - $values/base-tools/argocd-initial-objects.yaml
  - repoURL: https://github.com/dirien/gitops-promotion-tools-why-you-need-to-add-them-to-your-gitops-toolkit-in-2025
    targetRevision: main
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
