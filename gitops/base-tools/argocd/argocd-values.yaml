configs:
  cm:
    # Restore Application health so app-of-apps sync waves wait for child apps
    # to become Healthy (removed in Argo CD 1.8, see docs/operator-manual/health.md).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # GitOps Promoter: Pull Request deep links and commit status keys in the resource tree
    resource.links: |
      - url: '{{.resource.status.url}}'
        title: Pull Request
        icon.class: fa-code-pull-request
        if: resource.apiVersion == "promoter.argoproj.io/v1alpha1" && resource.kind == "PullRequest" && resource.status.url != nil && resource.status.url != ""
      - url: '{{.resource.status.pullRequest.url}}'
        title: Pull Request
        icon.class: fa-code-pull-request
        if: resource.apiVersion == "promoter.argoproj.io/v1alpha1" && resource.kind == "ChangeTransferPolicy" && resource.status.pullRequest != nil && resource.status.pullRequest.url != nil && resource.status.pullRequest.url != ""
    resource.customLabels: promoter.argoproj.io/commit-status
  params:
    "hydrator.enabled": true
    # Reduce polling interval when using webhooks (optimization)
    "timeout.reconciliation": "60s"
  secret:
    argocdServerAdminPassword: "$2a$10$5vm8wXaSdbuff0m9l21JdevzXBzJFPCi8sy6OOnpZMAG.fOXL7jvO"
    argocdServerAdminPasswordMtime: "2023-11-13T09:23:16Z"
    # GitHub webhook secret for authenticating webhook requests
    # IMPORTANT: Change this to a secure random string and configure the same in GitHub webhook
    "webhook.github.secret": "change-me-to-a-secure-random-string"
notifications:
  enabled: false
dex:
  enabled: false
commitServer:
  enabled: true
server:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  service:
    type: LoadBalancer
  extensions:
    enabled: true
    extensionList:
    - name: rollout-extension
      env:
      - name: EXTENSION_URL
        value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.0/extension.tar
    # GitOps Promoter UI extension (https://gitops-promoter.readthedocs.io/en/latest/integrating-with-argocd/)
    - name: extension-gitops-promoter
      env:
      - name: EXTENSION_NAME
        value: gitops-promoter
      - name: EXTENSION_URL
        value: https://github.com/argoproj-labs/gitops-promoter/releases/download/v0.39.0/gitops-promoter-argocd-extension.tar.gz
      - name: EXTENSION_CHECKSUM_URL
        value: https://github.com/argoproj-labs/gitops-promoter/releases/download/v0.39.0/gitops-promoter_0.39.0_checksums.txt
